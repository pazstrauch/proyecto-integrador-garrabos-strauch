<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="contenedor-padre">
        <a href="./index.html" class="logo-link">
            <img src="./img/logo-marca.png" alt="Logo tu casa" class="logo">
        </a>
        <div>
            <form action="./resultados.html" method="get">
                <input class="buscador" type="text" name="buscador" value="" placeholder="Buscar...">
            </form>
        </div>
        <nav>
            <ul class="barra-navegacion">
                <li><a href="./index.html" class="acceso">Home</a></li>
                <li><a href="./login.html" class="acceso">Ingresar</a></li>
                <li><a href="./register.html" class="acceso">Registrarme</a></li>
            </ul>
        </nav>
    </header>
    <main class="login">
        <h2 class="login-titulo">Inicia Sesion</h2>
        <section class="formulario">
            <form action="./index.html" method="get">
                <div class="campos">
                    <label for="mail">Correo electronico:</label>
                    <input type="email" name="mail" value="" required>
                </div>
                <div class="campos">
                    <label for="password">Contraseña:</label>
                    <input type="password" name="contraseña" value="" required>
                </div>
                <div class="campos">
                    <button type="submit">Ingresar</button>
                </div>
                <p class="campos">¿No tenes cuenta? <a href="./register.html">Registrate aca</a></p>
            </form> 
        </section>
    </main>           
    <footer>
        <nav>
            <ul class="menu-fondo">
                <li class="fondo-individual">
                    <a href="./index.html">Home</a>
                </li>
                <li class="fondo-individual">
                    <a href="./login.html">Login</a>
                </li>
                <li class="fondo-individual">
                    <a href="./register.html">Registrate</a>
                </li>
            </ul>
        </nav>
        <p> Sofia Garrabos y Paz Strauch</p>
    </footer>
</body>
</html>
