<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Casa</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="contenedor-padre">
        <a href="./index.html" class="logo-link">
            <img src="./img/logo-marca.png" alt="Logo tu casa" class="logo">
        </a>
        <div>
            <form action="./resultados.html" method="get">
                <input class="buscador" type="text" name="buscador" value="" placeholder="Buscar...">
                <p class="busquedas"></p>
            </form>
        </div>
        <nav>
            <ul class="barra-navegacion">
                <li><a href="./index.html" class="acceso">Home</a></li>
                <li class="menu-login"><a href="./login.html" class="acceso">Ingresar</a></li>
            <li class="menu-registro"><a href="./register.html" class="acceso">Registrarme</a></li>
            </ul>
        </nav>
        <p class="saludo-usuario"></p>
        <a href="#" class="logout">Logout</a>
    </header>
    <main class="cuerpo">
        <aside class="catalogo">
            <h2>Categorías</h2>
            <ul class="lista-categorias"></ul>
        </aside>
        <div class="centro">
            <section class="productos-aleatorios">
                <h2>Sports accessories</h2>
                <div class="todos-productos lista-sports"></div>
            </section>
            <section class="productos-destacados">
                <h2>Kitchen accessories</h2>
                <div class="todos-productos lista-kitchen"></div>
            </section>
        </div>
    </main>
    <footer>
        <nav>
            <ul class="menu-fondo">
                <li class="fondo-individual">
                    <a href="./index.html">Home</a>
                </li>
                <li class="fondo-individual">
                    <a href="./login.html">Login</a>
                </li>
                <li class="fondo-individual">
                    <a href="./register.html">Registrate</a>
                </li>
            </ul>
        </nav>
        <p> Sofia Garrabos y Paz Strauch</p>
    </footer>

    <script src="./js/index.js"></script>
    <script src="./js/saludo.js"></script>    
    <script src="./js/logout.js"></script>
</body>
</html>
