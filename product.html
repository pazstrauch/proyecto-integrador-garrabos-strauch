<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto seleccionado</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="contenedor-padre">
        <a href="./index.html" class="logo-link">
            <img src="./img/logo-marca.png" alt="Logo tu casa" class="logo">
        </a>
        <div>
            <form action="resultados.html" method="get">
                <input class="buscador" type="text" name="buscador" value="" placeholder="Buscar...">
                <p class="busquedas"></p>
            </form>
        </div>
        <nav>
            <ul class="barra-navegacion">
                <li><a href="./index.html" class="acceso">Home</a></li>
                <li class="menu-login"><a href="./login.html" class="acceso">Ingresar</a></li>
                <li class="menu-registro"><a href="./register.html" class="acceso">Registrarme</a></li>
            </ul>
        </nav>
        <p class="saludo-usuario"></p>
         <a href="#" class="logout botondetalle">Logout</a>
    </header>
    <main>
        <section class="detalle-porducto">
            <div class="foto-producto"></div>
            <article class="info-producto-detalle">
                <h3 class="nombre-producto"></h3>
                <p class="marca-producto"></p>
                <p class="descripcion-detalle"></p>
                <p class="precio-detalle"></p>
                <p class="categoria-producto"></p>
                <p class="stock-producto"></p>
                <p class="tags-producto"></p>
            </article>
        </section>
        <section>    
            <h3 class="titulo-reviews">Reviews</h3>
            <article class="reviews"></article>
        </section>
    </main>
    <footer>
        <nav>
            <ul class="menu-fondo">
                <li class="fondo-individual">
                    <a href="./index.html">Home</a>
                </li>
                <li class="fondo-individual">
                    <a href="./login.html">Login</a>
                </li>
                <li class="fondo-individual">
                    <a href="./register.html">Registrate</a>
                </li>
            </ul>
        </nav>
        <p> Sofia Garrabos y Paz Strauch</p>
    </footer>

<script src="./js/index.js"></script>
<script src="./js/saludo.js"></script>
<script src="./js/logout.js"></script>
<script src="./js/product.js"></script>

</body>
</html>
