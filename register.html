                    <label for="mail">Correo electronico:</label>
                    <input type="email" name="mail" value="" required>

                <div class="campos">

                    <input type="password" name="contraseña" value="" required>
                </div>
                <div class="campos">
                    <label for="password">Repetir contraseña:</label>
                    <input type="password" name="contraseña" value="" required>
                </div>
                <div class="campos">
                    <button type="submit">Registrarme</button>
                </div>
                <div class="campos">
                <input type="checkbox" name="terminos-y-condiciones" id="terminos-y-condiciones" required>
                <label for="terminos-y-condiciones">Acepto terminos y condiciones</label>
                </div>
                <p class="campos">¿Tenes cuenta? <a href="login.html">Inicia sesion aca</a></p>
